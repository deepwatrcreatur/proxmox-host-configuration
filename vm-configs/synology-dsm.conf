# Proxmox baseline for Synology DSM (VM 210) on pve-rog.
#
# Workload:
#   Dedicated NAS services frontend (SMB sharing, Bonjour Time Machine, cloud sync)
#   backed by host-managed ZFS RAIDZ1 pool ('tank') via staged NFS bind-mounts.
#
# Disks:
#   sata0: local-lvm:vm-210-disk-0 (1852M) - RedPill / ARC loader boot drive
#   sata1: tank-pool:vm-210-disk-0 (2000G) - DSM primary volume1 data pool
#          CRITICAL: discard=on enables guest TRIM to release unallocated space
#          to ZFS; refreservation=none must be kept on the host zvol.
#
# Network:
#   net0: virtio=BC:24:11:53:D5:D0,bridge=vmbr0 (static IP 10.10.11.88 via Kea DHCP)

boot: order=sata0
cores: 4
kvm: 0
machine: q35
memory: 4096
name: synology-dsm
net0: virtio=BC:24:11:53:D5:D0,bridge=vmbr0
onboot: 1
ostype: l26
sata0: local-lvm:vm-210-disk-0,size=1852M
sata1: tank-pool:vm-210-disk-0,discard=on,size=2000G
serial0: socket
smbios1: uuid=f0579929-f16b-41e1-9952-71c03e00f272
vmgenid: 4b2b1d76-7413-4419-a548-96a2d633d0a2
