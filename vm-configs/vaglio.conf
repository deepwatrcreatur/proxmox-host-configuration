# Proxmox baseline for Vaglio.
#
# Recommended target shape: dedicated VM, not LXC.
# Rationale:
#   - serial console remains available when guest networking breaks
#   - guest hardware shape becomes reproducible and reviewable in source control
#   - MAC-pinned naming inside NixOS can match this exact NIC definition
#
# Preserve the existing MAC address from the prior Vaglio guest so DHCP
# reservations and guest-side systemd-networkd matching stay stable.
# This file tracks the intended steady-state VM, not the temporary
# installer-boot shape used during first install.
# Replace VMID-specific disk paths, UUIDs, and vmgenid as needed.

agent: 1
serial0: socket
bios: seabios
boot: order=scsi0
cores: 8
cpu: host
machine: q35
memory: 8192
name: vaglio-vm
net0: virtio=BC:24:11:A4:02:7A,bridge=vmbr0
onboot: 1
ostype: l26
scsi0: scraps:vm-<VMID>-disk-0,size=64G
scsihw: virtio-scsi-pci
smbios1: uuid=00000000-0000-0000-0000-00000000v100
sockets: 1
vga: serial0
vmgenid: 00000000-0000-0000-0000-00000000v100
